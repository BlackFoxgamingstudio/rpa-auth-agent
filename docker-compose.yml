version: "3.9"
# Sovereign RPA Auth Agent — docker-compose
# Usage: docker-compose up --build

services:
  rpa-auth-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: sovereign-rpa-auth-agent:latest
    container_name: sovereign-rpa-auth-agent
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      SBB_RPA_TARGET_URL: ${SBB_RPA_TARGET_URL}
      SBB_RPA_USERNAME: ${SBB_RPA_USERNAME}
      SBB_RPA_PASSWORD: ${SBB_RPA_PASSWORD}
      SBB_MCP_SERVER_URL: ${SBB_MCP_SERVER_URL}
      SBB_API_KEY: ${SBB_API_KEY:-change-me}
      SBB_N8N_EVENT_BUS_URL: ${SBB_N8N_EVENT_BUS_URL:-http://host.docker.internal:5678/webhook/event-bus}
      SERVICE_PORT: 8788
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./.data:/app/.data:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8788/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sbb-platform

networks:
  sbb-platform:
    external: true
    name: sbb-platform-network
